services:
  postgres:
    image: postgres:16-alpine
    container_name: reachy-postgres
    environment:
      POSTGRES_USER: reachy
      POSTGRES_PASSWORD: reachy
      POSTGRES_DB: reachy
    ports:
      # Host port 5433 to avoid colliding with a system-installed Postgres on 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reachy -d reachy"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: reachy-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
